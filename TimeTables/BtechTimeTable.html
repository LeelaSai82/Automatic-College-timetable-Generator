    #back {

    .card1,
    .card2,
    .card3,

    .card5,

        background: rgb(2, 0, 36);

        border-radius: 10px;
        margin-right: 20px;
        overflow: hidden;
    }

    .card1:hover,

    }

    .card1,
    .card2,
    .card3,
    .card4,
    .card5,
    .card6 {
        transition: transform 0.5s;

    .card1 img,
    .card2 img,
    .card4 img,
    .card5 img,
    .card6 img,
    .card3 img {

        margin-bottom: 20px;
        width: 350px;
        height: 200px;
    }

    .details {
        display: flex;
        flex-direction: column;
        justify-content: center;

        border: none;
        background-color: rgb(255, 255, 255);
        box-shadow: 0px 0px 10px solid black;
        cursor: pointer;
    }

    @media screen and (max-width: 600px) {
        .card {
            flex-direction: column;
        }

        h1 {
            font-size: 30px;
        }

</style>
