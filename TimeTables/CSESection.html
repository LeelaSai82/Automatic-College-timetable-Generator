<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<body>
    <div class="main">
        <button id="back">back</button>
        <h1>Choose Section To Generate</h1>
        <section>
            <div class="card">
                <h2>CSE-A</h2>
                <a href="./CSEA.html">
                    <input type="button" value="create">
                </a>
            </div>
            <div class="card">
                <h2>CSE-B</h2>
                <a href="./CSEB.html">
                    <input type="button" value="create">
                </a>
            </div>
            <div class="card">
                <h2>CSE-C</h2>
                <a href="./CSEC.html">
                    <input type="button" value="create">
                </a>
            </div>
        </section>
    </div>
</body>
<style>
    * {
        font-family: "Poppins", sans-serif;
        font-weight: 500;
        font-style: normal;
    }
    #back {
        position: fixed;
        top: 16px;
        left: 35px;
        padding: 10px 20px;
        border: none;
        background-color: #010101a7;
        box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.1);
        color: white;
        font-size: 16px;
        cursor: pointer;
        border-radius: 7px;
    }
    h1 {
        margin-top: 10px;
        text-align: center;
        background-color: #afdde4;
        padding: 10px;
        border-radius: 20px;
    }
    section {
        justify-content: center;
        display: flex;
        flex-wrap: wrap;
        flex-direction: row;
        gap: 50px;
    }
    .card {
        text-align: center;
        padding: 10px;
        background-color: #b0e4af;
        border-radius: 10px;
    }
    input[type="button"] {
        margin-top: 20px;
        padding: 10px;
        width: 150px;
        border-radius: 15px;
        border: none;
        background-color: rgb(255, 255, 255);
        box-shadow: 0px 0px 10px solid black;
        cursor: pointer;
    }
</style>
<script>
    document.getElementById('back').addEventListener('click', () => {
        window.location.href = './BtechTimeTable.html';
    });
</script>
</html>
